name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Frontend Tests and Build
  frontend:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: motorbot-frontend/package-lock.json

    - name: Install dependencies
      working-directory: motorbot-frontend
      run: npm ci

    - name: Run linting
      working-directory: motorbot-frontend
      run: npm run lint

    - name: Run type checking
      working-directory: motorbot-frontend
      run: npm run type-check

    - name: Run tests
      working-directory: motorbot-frontend
      run: npm run test:coverage

    - name: Build frontend
      working-directory: motorbot-frontend
      run: npm run build

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        files: ./motorbot-frontend/coverage/coverage-final.json
        flags: frontend
        name: frontend-coverage
        fail_ci_if_error: false

  # Backend Tests and Build
  backend:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: motorbot-backend/requirements.txt

    - name: Install dependencies
      working-directory: motorbot-backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run linting (flake8)
      working-directory: motorbot-backend
      run: flake8 app tests

    - name: Run type checking (mypy)
      working-directory: motorbot-backend
      run: mypy app

    - name: Run tests
      working-directory: motorbot-backend
      run: pytest tests/ -v --cov=app --cov-report=xml

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        files: ./motorbot-backend/coverage.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false

  # Security scanning
  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Run Trivy vulnerability scanner (Docker image)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # Docker build (on main branch)
  docker-build:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build frontend Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./motorbot-frontend
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build backend Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./motorbot-backend
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Status check
  status:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Check job statuses
      run: |
        if [ "${{ needs.frontend.result }}" != "success" ] || [ "${{ needs.backend.result }}" != "success" ]; then
          echo "One or more jobs failed"
          exit 1
        fi
        echo "All checks passed!"
